<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="apple-mobile-web-app-status-bar-style" content="default">

</head>
<body class="antialiased bg-white dark:bg-zinc-950 text-zinc-950 dark:text-zinc-100 transition-colors duration-200">
